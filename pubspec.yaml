name: my_notes
description: A luxury 3D glass notes application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  math_expressions: ^2.4.0
  intl: ^0.19.0
  image_picker: ^1.0.7
  flutter_colorpicker: ^1.0.3
  google_fonts: ^6.1.0
  record: ^5.0.4
  audioplayers: ^5.2.1
  photo_view: ^0.15.0
  share_plus: ^7.2.2
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.0
  flutter_timezone: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
